
name: Build & Test
 
on: [push]
 
jobs:
  scan:
    name: Code Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
 
      - name: Run Aqua scanner
        uses: docker://aquasec/aqua-scanner:v0.217.1
        
      - name: Verify secret-test file is in the workspace
        shell: bash
        run: |
          git rev-parse HEAD
          git ls-files --error-unmatch -- aqua-suppression-test.pem
          test -s aqua-suppression-test.pem
          echo "Test file is tracked and non-empty"      
        
        with:
          args: trivy fs --sast --scanners misconfig,vuln,secret --db-repository=registry.aquasec.com/trivy-db:2 --java-db-repository=registry.aquasec.com/trivy-java-db:1 .
          # To customize which severities to scan for, add the following flag: --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          # To enable SAST scanning, add: --sast
          # To enable reachability scanning, add: --reachability
          # To enable npm/dotnet non-lock file scanning, add: --package-json / --dotnet-proj
        env:
          AQUA_KEY: ${{ secrets.AQUA_KEY }}
          AQUA_SECRET: ${{ secrets.AQUA_SECRET }}
          TRIVY_USERNAME: ${{secrets.TRIVY_USERNAME}}
          TRIVY_PASSWORD: ${{secrets.TRIVY_PASSWORD}}
          AQUA_URL: https://api.asia-1.supply-chain.cloud.aquasec.com
          TRIVY_DB_REPOSITORY: "public.ecr.aws/aquasecurity/trivy-db:latest"
          CSPM_URL: https://asia-1.api.cloudsploit.com
          TRIVY_RUN_AS_PLUGIN: 'aqua'
