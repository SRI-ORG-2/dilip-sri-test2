
name: Build & Test
 
on: [push]
 
jobs:
  scan:
    name: Code Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
 
      - name: Run Aqua scanner
        uses: docker://aquasec/aqua-scanner:v0.217.1
        
      - name: Verify secret-test file is in the workspace
        shell: bash
        run: |
          git rev-parse HEAD
          git ls-files --error-unmatch -- aqua-suppression-test.pem
          test -s aqua-suppression-test.pem
          echo "Test file is tracked and non-empty"      
        
        env:
          AQUA_KEY: ${{ secrets.AQUA_KEY }}
          AQUA_SECRET: ${{ secrets.AQUA_SECRET }}
          TRIVY_USERNAME: ${{secrets.TRIVY_USERNAME}}
          TRIVY_PASSWORD: ${{secrets.TRIVY_PASSWORD}}
          AQUA_URL: https://api.asia-1.supply-chain.cloud.aquasec.com
          TRIVY_DB_REPOSITORY: "public.ecr.aws/aquasecurity/trivy-db:latest"
          CSPM_URL: https://asia-1.api.cloudsploit.com
          TRIVY_RUN_AS_PLUGIN: 'aqua'
